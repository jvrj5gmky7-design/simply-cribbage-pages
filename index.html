<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simply Cribbage</title>
<style>
  :root {
    --cba: #c79a3d;
    --cba-rgb: 199, 154, 61;
    --bg-top: #262626;
    --bg-bottom: #111111;
    --body: #d0d0d0;
    --dimmer: #6e6e6e;
    --rule: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #1a1a1a;
    background-image: radial-gradient(ellipse at 50% 20%, var(--bg-top) 0%, var(--bg-bottom) 72%);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--body);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 420px; padding: 24px; text-align: center; }
  h1 {
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", serif;
    font-size: 2em;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0;
    color: #f2f2f2;
  }
  .version {
    margin-top: 16px;
    font-size: 0.78em;
    letter-spacing: 1px;
    color: var(--dimmer);
  }
  .suits-sub {
    margin: 22px 0 56px;
    letter-spacing: 3px;
    font-size: 0.68em;
    color: rgba(255,255,255,0.22);
  }
  .links { display: flex; flex-direction: column; gap: 36px; }
  a.card {
    display: block;
    padding: 0;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.02em;
    transition: color 0.15s;
  }
  a.card:hover {
    color: var(--cba);
  }
  a.card span {
    display: block;
    font-weight: 400;
    font-size: 0.78em;
    color: var(--dimmer);
    margin-top: 7px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Simply Cribbage</h1>
  <div class="version">2.3.20</div>
  <div class="suits-sub">&#9824;&ensp;&#9829;&ensp;&#9827;&ensp;&#9830;</div>
  <div class="links">
    <a class="card" href="privacy.html">Privacy Policy<span>What data we collect (none)</span></a>
    <a class="card" href="support.html">Support<span>FAQ and how to reach us</span></a>
    <a class="card" href="changelog.html">Change Log<span>Every release, what changed</span></a>
  </div>
</div>
</body>
</html>
