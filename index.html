<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simply Cribbage</title>
<style>
  :root {
    --cba: #c79a3d;
    --cba-rgb: 199, 154, 61;
    --bg-top: #262626;
    --bg-bottom: #111111;
    --body: #d0d0d0;
    --dimmer: #6e6e6e;
    --rule: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #1a1a1a;
    background-image: radial-gradient(ellipse at 50% 20%, var(--bg-top) 0%, var(--bg-bottom) 72%);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--body);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 420px; padding: 24px; text-align: center; }
  h1 {
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", serif;
    font-size: 2em;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0;
    color: #f2f2f2;
  }
  .version {
    margin-top: 10px;
    font-size: 0.78em;
    letter-spacing: 1px;
    color: var(--dimmer);
  }
  .suits-sub {
    margin: 14px 0 36px;
    letter-spacing: 3px;
    font-size: 0.68em;
    color: rgba(255,255,255,0.22);
  }
  .links { display: flex; flex-direction: column; gap: 14px; }
  a.card {
    display: block;
    border: 1px solid rgba(var(--cba-rgb), 0.28);
    border-radius: 12px;
    padding: 16px 20px;
    color: #f0f0f0;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.02em;
    transition: border-color 0.15s, color 0.15s;
  }
  a.card:hover {
    border-color: rgba(var(--cba-rgb), 0.6);
    color: var(--cba);
  }
  a.card span {
    display: block;
    font-weight: 400;
    font-size: 0.78em;
    color: var(--dimmer);
    margin-top: 4px;
  }
  footer {
    margin-top: 40px;
    font-size: 0.8em;
    color: var(--dimmer);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Simply Cribbage</h1>
  <div class="version">2.2.96</div>
  <div class="suits-sub">&#9824;&ensp;&#9829;&ensp;&#9827;&ensp;&#9830;</div>
  <div class="links">
    <a class="card" href="privacy.html">Privacy Policy<span>What data we collect (none)</span></a>
    <a class="card" href="support.html">Support<span>FAQ and how to reach us</span></a>
  </div>
  <footer>&#9824;&ensp;&#9829;&ensp;&#9827;&ensp;&#9830;</footer>
</div>
</body>
</html>
